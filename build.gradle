plugins {
    id 'base'
    id 'org.springframework.boot' version '3.5.16' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'io.incidentlens'
    version = '0.1.0'
    repositories { mavenCentral() }
}

subprojects {
    if (path == ':apps' || path == ':libs') return
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
    java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
    dependencyManagement {
        imports { mavenBom 'org.springframework.boot:spring-boot-dependencies:3.5.16' }
    }
    dependencies {
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.testcontainers:junit-jupiter'
        testImplementation 'org.testcontainers:mysql'
        testImplementation 'org.testcontainers:kafka'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-parameters', '-Xlint:unchecked'] }
    tasks.withType(Test).configureEach {
        maxHeapSize = '512m'
        testLogging { events 'failed', 'skipped'; exceptionFormat 'full' }
    }
    test { useJUnitPlatform { excludeTags 'integration' } }
    tasks.register('integrationTest', Test) {
        description = 'Runs real MySQL/Redis/Kafka tests; requires Docker.'
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform { includeTags 'integration' }
        shouldRunAfter test
    }
}
