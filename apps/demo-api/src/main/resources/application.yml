server:
  port: ${SERVER_PORT:8081}
  max-http-request-header-size: 16KB
  tomcat:
    max-http-form-post-size: 64KB
spring:
  application:
    name: demo-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/demo_api?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:incidentlens}
    password: ${DB_PASSWORD:incidentlens-local}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 5000
        request.timeout.ms: 3000
        max.block.ms: 3000
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        incidentlens.workload.duration: true
        incidentlens.catalog.database: true
logging:
  structured:
    json:
      add:
        service: ${spring.application.name}
    format:
      console: logstash
  level:
    org.apache.kafka: WARN
