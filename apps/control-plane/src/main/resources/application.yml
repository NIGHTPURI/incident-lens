server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-http-form-post-size: 32KB
    threads:
      max: 40
  max-http-request-header-size: 16KB
spring:
  application:
    name: control-plane
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/control_plane?serverTimezone=UTC}
    username: ${DB_USER:incidentlens}
    password: ${DB_PASSWORD:incidentlens-local}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s
      connect-timeout: 1s
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      service: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}
incidentlens:
  demo-api-url: ${DEMO_API_URL:http://localhost:8081}
  demo-worker-url: ${DEMO_WORKER_URL:http://localhost:8082}
  rca:
    base-url: ${RCA_BASE_URL:https://api.openai.com/v1}
    api-key: ${RCA_API_KEY:}
    model: ${RCA_MODEL:}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
