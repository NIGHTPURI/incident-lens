name: verification
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile, unit and infrastructure integration tests
        run: ./gradlew build integrationTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            apps/*/build/reports/tests/
  web:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: apps/web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate scripts and Compose profiles
        run: |
          for script in scripts/*.sh infra/mysql/01-databases.sh; do bash -n "$script"; done
          docker compose --profile observability --profile loadtest config --quiet
      - name: Build runtime images
        run: docker compose build
      - name: Verify PowerShell experiment protocol and cleanup
        shell: pwsh
        run: |
          ./scripts/test-local-target.ps1
          ./scripts/tests/compare-protocol.tests.ps1
      - name: Run complete degraded / recovered smoke experiment
        run: |
          docker compose up -d --wait --wait-timeout 600
          VUS=2 DURATION_SECONDS=5 PARAMETER=100 RECOVERY_SECONDS=2 bash scripts/demo-compare.sh
      - name: Capture Compose logs
        if: always()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-smoke
          path: |
            compose.log
            artifacts/
      - name: Stop local infrastructure
        if: always()
        run: docker compose stop
      - name: Reject committed secrets and build outputs
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)(node_modules|build|dist)/|\.(pem|key)$'; then
            echo 'Unexpected local configuration/build output in repository'
            exit 1
          fi
