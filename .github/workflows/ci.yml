name: verification
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile, unit and infrastructure integration tests
        run: ./gradlew build integrationTest --no-daemon
      - name: Verify isolated beginner curriculum examples
        run: |
          python3 examples/beginner/verify.py
          python3 examples/beginner/advanced/run.py all
          ./gradlew -p examples/beginner/spring-api --offline --no-daemon test
          ./gradlew -p examples/beginner/data-jpa --offline --no-daemon test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            apps/*/build/reports/tests/
            examples/beginner/*/build/reports/tests/
  web:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: apps/web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  languages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        track: [python, javascript, csharp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        if: matrix.track == 'javascript'
        with: {node-version: '22.23.2'}
      - uses: actions/setup-dotnet@v4
        if: matrix.track == 'csharp'
        with: {dotnet-version: '8.0.x'}
      - name: Python intro, HTTP/store and actual recovery
        if: matrix.track == 'python'
        run: |
          python -m unittest discover -s examples/language-paths/python -v
          python examples/language-paths/verify_intro.py python
          python -m pip install -r examples/language-paths/advanced/python/requirements.lock
          (cd examples/language-paths/advanced/python && python -m unittest -v)
          python examples/language-paths/advanced/verify_recovery.py python
      - name: JavaScript and compiled TypeScript HTTP/recovery
        if: matrix.track == 'javascript'
        run: |
          (cd examples/language-paths/javascript && npm ci && npm test)
          python examples/language-paths/verify_intro.py javascript
          (cd examples/language-paths/advanced/javascript && npm ci && npm run typecheck && npm run build && npm test)
          python examples/language-paths/advanced/verify_recovery.py javascript
          python examples/language-paths/advanced/verify_recovery.py typescript
      - name: C# store, real HTTP and process recovery
        if: matrix.track == 'csharp'
        run: |
          dotnet build examples/language-paths/csharp/CatalogPractice.csproj
          dotnet restore examples/language-paths/advanced/csharp/tests/CatalogAdvanced.Tests.csproj --locked-mode
          dotnet test examples/language-paths/advanced/csharp/tests/CatalogAdvanced.Tests.csproj --no-restore
      - name: Shared SQLite migration and rollback
        run: python -m unittest discover -s examples/language-paths/advanced -p test_migrate.py -v
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate scripts and Compose profiles
        run: |
          for script in scripts/*.sh infra/mysql/01-databases.sh; do bash -n "$script"; done
          docker compose --profile observability --profile loadtest config --quiet
      - name: Build runtime images
        run: docker compose build
      - name: Verify PowerShell experiment protocol and cleanup
        shell: pwsh
        run: ./scripts/tests/compare-protocol.tests.ps1
      - name: Run complete degraded / recovered smoke experiment
        run: |
          docker compose up -d --wait --wait-timeout 600
          VUS=2 DURATION_SECONDS=5 PARAMETER=100 RECOVERY_SECONDS=2 bash scripts/demo-compare.sh
      - name: Capture Compose logs
        if: always()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-smoke
          path: |
            compose.log
            artifacts/
      - name: Stop local infrastructure
        if: always()
        run: docker compose down -v
      - name: Reject committed secrets and build outputs
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)(node_modules|build|dist)/|\.(pem|key)$'; then
            echo 'Unexpected local configuration/build output in repository'
            exit 1
          fi
